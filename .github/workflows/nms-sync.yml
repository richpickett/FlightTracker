name: NMS NOTAM sync
on:
  schedule:
    - cron: '17 8 * * *'
    - cron: '*/15 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: nms-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run NMS sync
        env:
          NMS_HOST: ${{ secrets.NMS_HOST }}
          NMS_CLIENT_ID: ${{ secrets.NMS_CLIENT_ID }}
          NMS_CLIENT_SECRET: ${{ secrets.NMS_CLIENT_SECRET }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE: ${{ secrets.SUPABASE_SERVICE_ROLE }}
          NMS_CLASSES: 'DOMESTIC,INTERNATIONAL,FDC'
        run: |
          MODE=incremental
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then MODE=bulk; fi
          if [ "${{ github.event_name }}" = "schedule" ] && [ "${{ github.event.schedule }}" = "17 8 * * *" ]; then MODE=bulk; fi
          echo "event=${{ github.event_name }} schedule='${{ github.event.schedule }}' -> MODE=$MODE"
          node netlify/functions/nms-sync.js "$MODE"
