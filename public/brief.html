<style>
  :root{--ink:#1a2028;--blue:#0b3d91;--dim:#5b6b7a;--line:#d3dae6;--red:#a11;}
  *{box-sizing:border-box} body{margin:0;background:#eef1f5;color:var(--ink);font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;font-size:14px;line-height:1.5}
  .sheet{max-width:900px;margin:0 auto;background:#fff;min-height:100vh;padding:18px 22px 60px;box-shadow:0 0 24px #0002}
  .topbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;border-bottom:3px solid var(--blue);padding-bottom:10px;margin-bottom:12px}
  .topbar img{height:32px} .topbar a{color:var(--blue);text-decoration:none;font-weight:600;font-size:13px;border:1px solid var(--line);border-radius:7px;padding:5px 9px}
  #rin{flex:1;min-width:200px;border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:14px;letter-spacing:.5px;box-sizing:border-box;font-family:inherit;resize:vertical;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.35;min-height:38px;text-transform:uppercase}
  .ac{display:flex;gap:6px;flex-wrap:wrap;font-size:12px;color:var(--dim);align-items:center}
  .ac input{width:56px;border:1px solid var(--line);border-radius:6px;padding:5px} #cruise,#amax,#amin,#usable{width:74px} #gph{width:64px} #dep{width:66px}
  .acerr{background:#fdecec;border:1px solid #e0a0a0;color:#b02020;border-radius:8px;padding:9px 13px;margin:0 0 12px;font-size:13px;font-weight:600} .ac select{border:1px solid var(--line);border-radius:6px;padding:5px;font-size:12px}
  button{background:var(--blue);color:#fff;border:none;border-radius:8px;padding:8px 12px;font-size:13px;font-weight:600;cursor:pointer} button.sec{background:#e7edf6;color:var(--blue)}
  h1{font-size:19px;margin:6px 0 2px;color:var(--blue)} h2{font-size:12px;text-transform:uppercase;letter-spacing:.7px;color:var(--blue);border-bottom:1px solid var(--line);padding-bottom:3px;margin:16px 0 6px}
  .sub{color:var(--dim);font-size:12.5px;margin:2px 0} .lead{font-size:13.5px;margin:6px 0 2px}
  .narr{background:#f4f8ff;border:1px solid #cfe0f7;border-radius:8px;padding:10px 13px;margin:8px 0;font-size:13.5px;line-height:1.6}
  table{width:100%;border-collapse:collapse;font-size:12.5px;margin:4px 0} th,td{border:1px solid var(--line);padding:4px 7px;text-align:left} th{background:#eef3fb;color:var(--blue)} td.hl,th.hl{background:#fff5e0}
  .leg{border:1px solid var(--line);border-left:5px solid var(--blue);border-radius:6px;padding:8px 11px;margin:8px 0} .leg.warn{border-left-color:var(--red);background:#fdf2f2}
  .leg h3{margin:0 0 3px;font-size:14.5px;color:var(--blue)} .leg p{margin:2px 0} .fuel{color:#0b6b3a;font-weight:600} .fuel.bad{color:var(--red)} .hw{color:#a15c00} .tw{color:#0b6b3a}
  .wxrow{padding:6px 0;border-bottom:1px solid #eef1f5} .badge{display:inline-block;padding:1px 7px;border-radius:5px;color:#fff;font-weight:700;font-size:12px}
  .raw{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;color:#243247;display:block;margin-top:2px;white-space:pre-wrap} .taf{color:#0b4a8a}
  .onfield{display:inline-block;background:#0b6b3a;color:#fff;font-weight:700;font-size:10px;letter-spacing:.04em;padding:1px 6px;border-radius:4px;margin:0 3px;vertical-align:1px;font-family:system-ui,-apple-system,sans-serif}
  .ntag{display:inline-block;color:#fff;font-weight:700;font-size:9.5px;letter-spacing:.03em;padding:1px 5px;border-radius:4px;margin-right:5px;vertical-align:1px;font-family:system-ui,-apple-system,sans-serif}
  ul{margin:5px 0;padding-left:18px} li{margin:2px 0} a.inline{color:var(--blue)}
  .flag{background:#fff8e6;border:1px solid #e8cf7a;border-radius:6px;padding:7px 10px;margin:6px 0;font-size:13px}
  .foot{color:var(--dim);font-size:11px;margin-top:16px;border-top:1px solid var(--line);padding-top:8px}
  #mapwrap{position:relative;margin:8px 0} #bmap{height:340px;border:1px solid var(--line);border-radius:8px}
  .mapleg{font-size:11px;color:var(--dim);margin-top:4px} .mapleg .sw{display:inline-block;width:11px;height:11px;border-radius:2px;margin:0 3px 0 8px;vertical-align:middle}
  #hzmap{height:320px;border:1px solid var(--line);border-radius:8px;margin:4px 0}
  .mapctl{display:flex;gap:14px;align-items:center;flex-wrap:wrap;font-size:12.5px;color:var(--txt);margin:6px 0 2px}
  .mapctl label{display:flex;align-items:center;gap:4px;cursor:pointer} .mapctl input{margin:0}
  .mapctl .sw{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-1px}
  .bm-lbl{background:#fff;border:1px solid #0b3d91;border-radius:4px;font:700 10px/1.4 Arial;color:#0b2e6b;text-align:center;padding:0 3px;box-shadow:0 1px 2px #0003;white-space:nowrap}
  @media print{ body{background:#fff} .sheet{box-shadow:none;max-width:none} .noprint{display:none!important} .leg{break-inside:avoid} #bmap{height:300px} }
</style>

<script>
var AIRPORTS={}, CFG={}, STATE={}, WINDARR=null, BMAP=null, DB={airports:{},navaids:{},fixes:{},airways:{},procedures:{}};
function pad(n){return (n<10?'0':'')+n;}
function gcNm(a,b){var R=3440.065,p1=a[0]*Math.PI/180,p2=b[0]*Math.PI/180,dp=(b[0]-a[0])*Math.PI/180,dl=(b[1]-a[1])*Math.PI/180;var x=Math.sin(dp/2)*Math.sin(dp/2)+Math.cos(p1)*Math.cos(p2)*Math.sin(dl/2)*Math.sin(dl/2);return 2*R*Math.asin(Math.sqrt(x));}
function brg(a,b){var y=Math.sin((b[1]-a[1])*Math.PI/180)*Math.cos(b[0]*Math.PI/180);var x=Math.cos(a[0]*Math.PI/180)*Math.sin(b[0]*Math.PI/180)-Math.sin(a[0]*Math.PI/180)*Math.cos(b[0]*Math.PI/180)*Math.cos((b[1]-a[1])*Math.PI/180);return Math.round((Math.atan2(y,x)*180/Math.PI+360)%360);}
function compass(d){var s=['N','NNE','NE','ENE','E','ESE','SE','SSE','S','SSW','SW','WSW','W','WNW','NW','NNW'];return s[Math.round(d/22.5)%16];}
function cat(v,c){if(v<1||c<500)return'LIFR';if(v<3||c<1000)return'IFR';if(v<=5||c<=3000)return'MVFR';return'VFR';}
var CC={VFR:'#22a06b',MVFR:'#2b6fd6',IFR:'#e23b3b',LIFR:'#c026c0',NA:'#8090a0'};
function resolve(id){id=(id||'').trim().toUpperCase();return AIRPORTS[id]||AIRPORTS['K'+id]||null;}
function fmtAge(iso){if(!iso)return'';var m=Math.round((Date.now()-new Date(iso).getTime())/60000);return m<0?'':('('+m+'m)');}
function num(id,def){var v=parseFloat(document.getElementById(id).value);return isFinite(v)&&v>0?v:def;}
var LV=[[925,2500,'3,000′'],[850,5000,'5,000′'],[700,10000,'FL100'],[600,13800,'FL140'],[500,18300,'FL180'],[400,23600,'FL240'],[300,30100,'FL300'],[250,34000,'FL340'],[200,38700,'FL390'],[150,44600,'FL450']];
function nearestLv(ft){var b=LV[0];LV.forEach(function(x){if(Math.abs(x[1]-ft)<Math.abs(b[1]-ft))b=x;});return b;}
function lvLabel(h){for(var i=0;i<LV.length;i++)if(LV[i][0]===h)return LV[i][2];return h+'mb';}
function headwind(ws,wd,crs){return ws*Math.cos((wd-crs)*Math.PI/180);}
function hourStr(ms){var d=new Date(ms);return d.getUTCFullYear()+'-'+pad(d.getUTCMonth()+1)+'-'+pad(d.getUTCDate())+'T'+pad(d.getUTCHours())+':00';}
function hhmmL(ms){var d=new Date(ms);return pad(d.getHours())+pad(d.getMinutes());}
function hhmmZ(ms){var d=new Date(ms);return pad(d.getUTCHours())+pad(d.getUTCMinutes())+'Z';}
function depEpoch(){
  var s=(document.getElementById('dep').value||'').replace(/[^0-9]/g,''); if(s.length<3) return Date.now();
  var hh=parseInt(s.slice(0,s.length-2)),mm=parseInt(s.slice(-2)); if(isNaN(hh)||isNaN(mm))return Date.now();
  var dv=(document.getElementById('depdate')||{}).value||'', z=document.getElementById('deptz').value==='Z', ep;
  if(dv){ var p=dv.split('-'),y=+p[0],mo=+p[1]-1,da=+p[2];
    ep = z ? Date.UTC(y,mo,da,hh,mm) : new Date(y,mo,da,hh,mm,0,0).getTime();
    return ep;                                   // explicit date — trust it, no next-day bump
  }
  var now=new Date();
  if(z){ ep=Date.UTC(now.getUTCFullYear(),now.getUTCMonth(),now.getUTCDate(),hh,mm); }
  else { var d=new Date(); d.setHours(hh,mm,0,0); ep=d.getTime(); }
  if(ep < Date.now()-3600000) ep+=86400000;   // assume next day if well past
  return ep;
}
function getRoute(){var u=new URLSearchParams(location.search).get('route');if(u)return u;try{var s=localStorage.getItem('pw_route');if(s)return s;}catch(e){}return 'KSAN BRDR7 JLI KPSP';}
function saveAC(){if(window.PW_SHARED)return;try{var o={};['reg','depdate','dep','deptz','cruise','tas','usable','gph','rsv','funit','flowunit','amax','amin'].forEach(function(k){o[k]=document.getElementById(k).value;});localStorage.setItem('pw_ac',JSON.stringify(o));localStorage.setItem('pw_reg',(document.getElementById('reg')||{}).value||'');
  // if this tail is already a saved aircraft, keep its stored profile in sync with the form edits
  var reg=(o.reg||'').toUpperCase().replace(/[^A-Z0-9]/g,''); if(reg){var f=fleetGet(); if(f.list[reg]){var ac={};AC_FIELDS.forEach(function(k){ac[k]=o[k]||'';});ac.reg=reg;f.list[reg]=ac;fleetPut(f); if(!PW_applyingFleet&&window.PW_saveFleet) window.PW_saveFleet(f);}}
}catch(e){}}
// ---- saved aircraft ("fleet"): multiple profiles keyed by tail, one marked default ----
// Stored in localStorage; when signed in, pwauth.js mirrors it to the account (profiles.fleet) so it syncs across devices.
var AC_FIELDS=['reg','cruise','tas','usable','gph','rsv','funit','flowunit','amax','amin'];   // persisted per aircraft (not date/dep time)
var PW_applyingFleet=false;   // guard so applying a cloud fleet doesn't push it straight back up
function fleetGet(){ try{var f=JSON.parse(localStorage.getItem('pw_fleet')||'null'); if(f&&f.list) return f;}catch(e){}
  try{var a=JSON.parse(localStorage.getItem('pw_ac')||'null'); if(a&&a.reg){var reg=(a.reg||'').toUpperCase().replace(/[^A-Z0-9]/g,''); if(reg){var o={};AC_FIELDS.forEach(function(k){o[k]=a[k]||'';});o.reg=reg;var f2={list:{},def:reg};f2.list[reg]=o;return f2;}}}catch(e){}   // migrate legacy single profile
  return {list:{},def:''}; }
function fleetPut(f){ try{localStorage.setItem('pw_fleet',JSON.stringify(f));}catch(e){} }
function acRead(){ var o={}; AC_FIELDS.forEach(function(k){o[k]=(document.getElementById(k)||{}).value||'';}); o.reg=(o.reg||'').toUpperCase().replace(/[^A-Z0-9]/g,''); return o; }
function acApply(o){ AC_FIELDS.forEach(function(k){var e=document.getElementById(k); if(e&&o[k]!=null) e.value=o[k];}); }
function fleetPopulate(cur){ var f=fleetGet(), s=document.getElementById('acsel'); if(!s) return; cur=(cur||(document.getElementById('reg')||{}).value||f.def||'').toUpperCase(); var regs=Object.keys(f.list).sort();
  s.innerHTML='<option value="">— saved a/c —</option>'+regs.map(function(r){return '<option value="'+r+'"'+(r===cur?' selected':'')+'>'+r+(r===f.def?' ★':'')+'</option>';}).join(''); }
function fleetSync(f){ if(window.PW_saveFleet) window.PW_saveFleet(f); }   // push to account when signed in (no-op otherwise)
function fleetSaveCurrent(){ var o=acRead(); if(!o.reg){var re=document.getElementById('reg'); if(re) re.focus(); return;} var f=fleetGet(); f.list[o.reg]=o; if(!f.def) f.def=o.reg; fleetPut(f); fleetSync(f); fleetPopulate(o.reg); }
function fleetSetDefault(){ var o=acRead(); if(!o.reg) return; var f=fleetGet(); if(!f.list[o.reg]) f.list[o.reg]=o; f.def=o.reg; fleetPut(f); fleetSync(f); fleetPopulate(o.reg); }
function fleetDeleteSel(){ var s=document.getElementById('acsel'); var reg=(s&&s.value)||''; if(!reg) return; var f=fleetGet(); delete f.list[reg]; if(f.def===reg) f.def=Object.keys(f.list)[0]||''; fleetPut(f); fleetSync(f); fleetPopulate(); }
function fleetSelect(reg){ if(!reg) return; var f=fleetGet(), o=f.list[reg]; if(o){ acApply(o); saveAC(); fleetPopulate(reg); render((document.getElementById('rin')||{}).value||''); } }
function loadAC(){try{var a=JSON.parse(localStorage.getItem('pw_ac')||'{}');['reg','depdate','dep','deptz','cruise','tas','usable','gph','rsv','funit','flowunit','amax','amin'].forEach(function(k){if(a[k]!=null&&a[k]!=='')document.getElementById(k).value=a[k];});var rr=localStorage.getItem('pw_reg');if(rr){var re=document.getElementById('reg');if(re)re.value=rr.toUpperCase();}}catch(e){}}
function setRoute(str){if(window.PW_SHARED)return;var rg=((document.getElementById('reg')||{}).value||'').toUpperCase().replace(/[^A-Z0-9]/g,'');try{localStorage.setItem('pw_route',str);if(rg)localStorage.setItem('pw_reg',rg);}catch(e){}history.replaceState(null,'',location.pathname+'?route='+encodeURIComponent(str)+(rg?'&reg='+encodeURIComponent(rg):''));}
function lockShared(){['rin','reg','depdate','dep','deptz','cruise','tas','usable','gph','rsv','funit','flowunit','amax','amin','acsel','acsave','acdef','acdel','go'].forEach(function(id){var e=document.getElementById(id); if(e) e.disabled=true;}); if(!document.getElementById('pw-shared-banner')){var out=document.getElementById('out'); var b=document.createElement('div'); b.id='pw-shared-banner'; b.style.cssText='background:#eef4ff;border:1px solid #cfe0f5;padding:7px 11px;border-radius:6px;margin:6px 0;color:#33506e;font-size:13px'; b.innerHTML='\uD83D\uDD12 <b>Shared flight (view only).</b> Aircraft, timing and route come from the sender and cannot be edited here.'; if(out&&out.parentNode) out.parentNode.insertBefore(b,out);}}

function _pwJSON(u,o){ return fetch(u,o||{}).then(function(r){return r.json();}).catch(function(){return {};}); }
Promise.all([
  _pwJSON('/wx/airports.json'),
  _pwJSON('/wx/wx-config.json',{cache:'no-store'}),
  _pwJSON('/wx/navaids.json'), _pwJSON('/wx/fixes.json'), _pwJSON('/wx/airways.json'), _pwJSON('/wx/procedures.json')
]).then(function(res){AIRPORTS=res[0]||{};CFG=res[1]||{};DB.airports=AIRPORTS;DB.navaids=res[2]||{};DB.fixes=res[3]||{};DB.airways=res[4]||{};DB.procedures=res[5]||{}; var _SP=new URLSearchParams(location.search), _acRaw=_SP.get('ac'); window.PW_SHARED=!!_acRaw;
  if(window.PW_SHARED){ try{var _ac=JSON.parse(_acRaw);['reg','depdate','dep','deptz','cruise','tas','usable','gph','rsv','funit','flowunit','amax','amin'].forEach(function(k){var e=document.getElementById(k); if(e&&_ac[k]!=null&&_ac[k]!=='') e.value=_ac[k];});}catch(e){} } else { var _hasAc=false; try{var _a=JSON.parse(localStorage.getItem('pw_ac')||'null'); _hasAc=!!(_a&&_a.reg);}catch(e){}
    if(_hasAc){ loadAC(); }   // restore last-used aircraft (preserves selection across map↔briefing) — default only seeds a fresh slate
    else { var _f=fleetGet(); if(_f.def&&_f.list[_f.def]) acApply(_f.list[_f.def]); else loadAC(); }
    fleetPopulate(); }
  try{var _ur=_SP.get('reg'); if(_ur){var _re=document.getElementById('reg'); if(_re) _re.value=_ur.toUpperCase().replace(/[^A-Z0-9]/g,'');}}catch(e){}
  var dd=document.getElementById('depdate'); if(dd&&!dd.value){var n=new Date();dd.value=n.getFullYear()+'-'+('0'+(n.getMonth()+1)).slice(-2)+'-'+('0'+n.getDate()).slice(-2);}
  var r=getRoute();document.getElementById('rin').value=r;render(r); if(window.PW_SHARED) lockShared();});

function buildMap(pts, allpts){
  if(BMAP){ try{BMAP.remove();}catch(e){} BMAP=null; }
  BMAP=L.map('bmap',{zoomControl:true,attributionControl:false});
  L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Topo_Map/MapServer/tile/{z}/{y}/{x}',{maxZoom:16,crossOrigin:true}).addTo(BMAP);
  var full=(allpts&&allpts.length?allpts:pts);
  var ll=full.map(function(p){return [p.la,p.lo];});
  L.polyline(ll,{color:'#0b3d91',weight:6,opacity:.5}).addTo(BMAP);

function legTimes(useWind){ // returns {gs:[],hr:[],burn:[],startMs:[],comp:[],wind:[]}
  var S=STATE,r={gs:[],hr:[],burn:[],startMs:[],comp:[],wind:[]},t=S.dep;

    if(useWind&&WINDARR&&WINDARR[i]){ var hs=hourStr(t); var ix=WINDARR[i].time.indexOf(hs); if(ix<0)ix=0;
      var dr=WINDARR[i]['wd'+S.lv[0]][ix], sp=WINDARR[i]['ws'+S.lv[0]][ix], tc=WINDARR[i]['t'+S.lv[0]]?WINDARR[i]['t'+S.lv[0]][ix]:null;
      if(dr!=null){ comp=headwind(sp,dr,L.crs); w={dir:dr,spd:sp,tC:tc}; } }

var NOTAM_CATS=[
  {re:/\bRWY\b|RUNWAY/,label:'RUNWAY',color:'#c0392b',pri:1},
  {re:/\bILS\b|\bLOC\b|\bGP\b|\bVOR\b|\bGPS\b|RNAV|\bDME\b|\bIAP\b|APPROACH|\bAPCH\b|\bNDB\b|\bWAAS\b/,label:'APCH/NAV',color:'#b45309',pri:1},
  {re:/\bTFR\b|AIRSPACE|TEMPORARY FLIGHT|PROHIBITED|RESTRICTED/,label:'AIRSPACE',color:'#7c3aed',pri:1},
  {re:/\bTWY\b|TAXIWAY/,label:'TAXIWAY',color:'#0b3d91',pri:2},
  {re:/OBST|CRANE|\bTOWER\b|\bTWR\b/,label:'OBSTACLE',color:'#0b6b3a',pri:2},
  {re:/\bLGT\b|\bLGTD\b|LIGHTING|\bPAPI\b|\bVASI\b|\bREIL\b|\bMALSR\b|\bODALS\b|BEACON/,label:'LIGHTING',color:'#2563eb',pri:3},
  {re:/\bFUEL\b|AVGAS|JET A|\bSVC\b|SERVICE|\bAWOS\b|\bASOS\b/,label:'SERVICES',color:'#6b7280',pri:3}
];
function notamCat(t){ t=(t||'').toUpperCase(); for(var i=0;i<NOTAM_CATS.length;i++){ if(NOTAM_CATS[i].re.test(t)) return NOTAM_CATS[i]; } return {label:'OTHER',color:'#6b7280',pri:4}; }
var NOTAM_GLOSS=[[/\bRWY\b/g,'Runway'],[/\bTWY\b/g,'Taxiway'],[/\bCLSD\b/g,'closed'],[/\bAPCH\b/g,'approach'],[/\bU\/S\b/g,'unserviceable'],[/\bUNSVC\b/g,'unserviceable'],[/\bMAINT\b/g,'maintenance'],[/\bWIP\b/g,'work in progress'],[/\bAVBL\b/g,'available'],[/\bOBST\b/g,'obstacle'],[/\bACFT\b/g,'aircraft'],[/\bBTN\b/g,'between'],[/\bTWR\b/g,'tower'],[/\bLGTD\b/g,'lighted'],[/\bPSN\b/g,'position'],[/\bEXC\b/g,'except']];
function notamPlain(t){ t=String(t||''); NOTAM_GLOSS.forEach(function(g){ t=t.replace(g[0],g[1]); }); return t; }
// ---- briefing cost tally (paid APIs only; METAR/TAF/winds/hazards are free) ----
var PW_COST={places:0,notam:0,llmUSD:0,llmTok:0};
var COST_UNIT={places:0.035, notam:0.0038};   // USD/call: Google Places Enterprise Nearby; SkyLink Basic ($19/5000)
function costTotal(){ return PW_COST.places*COST_UNIT.places + PW_COST.notam*COST_UNIT.notam + PW_COST.llmUSD; }
function updateCostBar(){ var el=document.getElementById('costbar'); if(!el) return;
  var parts=[]; if(PW_COST.notam)parts.push('NOTAM ×'+PW_COST.notam); if(PW_COST.places)parts.push('Food ×'+PW_COST.places);
  if(PW_COST.llmTok)parts.push('AI '+PW_COST.llmTok.toLocaleString()+' tok $'+PW_COST.llmUSD.toFixed(4));
  el.innerHTML='Est. cost this briefing: <b>$'+costTotal().toFixed(4)+'</b>'+(parts.length?' <span style="color:#889">· '+parts.join(' · ')+'</span>':' <span style="color:#889">(free sources only)</span>'); }

var NOTAM_RES={}, NOTAM_AI={};
function loadNotams(pts){
  if(!CFG.notamProxy)return;
  var box=document.getElementById('notams');if(!box)return;
  NOTAM_RES={};
  box.className='';box.innerHTML='<div class="sub">⚠ Location NOTAMs only — not a substitute for a full official briefing. Confirm TFRs, FDC &amp; GPS NOTAMs at <a class="inline" href="https://www.1800wxbrief.com" target="_blank">1800wxbrief</a>. · Summarize <select id="nsum" style="font-size:12px;padding:1px 3px"><option value="off">Off</option><option value="plain">Plain (free)</option><option value="ai">AI</option></select><span id="nquota"></span></div>';
  var sel=document.getElementById('nsum'); if(sel) sel.addEventListener('change',function(){ Object.keys(NOTAM_RES).forEach(renderOneNotam); });
  var notCfg=false, items=[];
  pts.forEach(function(p){ var blk=document.createElement('div');blk.className='wxrow';blk.innerHTML='<b>'+p.id+'</b> <span style="color:#889">…</span>';box.appendChild(blk); items.push({p:p,blk:blk}); });
  function onData(j,p,blk){
    if(j.quota&&j.quota.limit!=null){ var qe=document.getElementById('nquota'); if(qe) qe.innerHTML=' · <b style="color:#0b6b3a">SkyLink '+(j.quota.remaining!=null?j.quota.remaining.toLocaleString():'?')+'/'+j.quota.limit.toLocaleString()+' left</b>'; }
    if(j.configured===false){ if(!notCfg){notCfg=true;box.innerHTML='<div class="sub">Live NOTAMs not configured yet — add a NOTAM key in Netlify, or use <a class="inline" href="https://notams.aim.faa.gov/notamSearch/" target="_blank">FAA NOTAM Search ↗</a>.</div>';} return; }
    NOTAM_RES[p.id]={j:j,p:p,blk:blk}; renderOneNotam(p.id);
  }
  // Serialize (one at a time, small gap) so a low free-tier rate limit can't 429 us on parallel airports.
  var qi=0;
  function next(){ if(qi>=items.length) return; var it=items[qi++];
    fetch(CFG.notamProxy+'?id='+encodeURIComponent(it.p.id)).then(function(r){return r.json();}).then(function(j){ PW_COST.notam++; updateCostBar(); onData(j,it.p,it.blk); })
      .catch(function(){ it.blk.innerHTML='<b>'+it.p.id+'</b> <span style="color:#889">NOTAMs unavailable</span>'; })
      .then(function(){ setTimeout(next,350); });
  }
  next();
}
function renderOneNotam(id){
  var e=NOTAM_RES[id]; if(!e) return; var j=e.j, p=e.p, blk=e.blk;
  if(j.error){ blk.innerHTML='<b>'+p.id+'</b> <span style="color:#889">NOTAMs unavailable ('+nesc(j.error)+(j.detail?' — '+nesc(j.detail):'')+')</span>'; return; }
  var list=j.notams||[];
  if(!list.length){ blk.innerHTML='<b>'+p.id+'</b> <span style="color:#889">no current NOTAMs</span>'; return; }
  var total=j.total||list.length;
  var arr=list.map(function(n){ n._c=notamCat(n.text); return n; }).sort(function(a,b){ return a._c.pri-b._c.pri; });
  var mode=(document.getElementById('nsum')||{}).value||'off';
  if(mode==='ai') return renderNotamAI(id,arr,total);
  if(mode==='plain'){
    var sig=arr.filter(function(n){return n._c.pri<=2;}), byCat={};
    arr.forEach(function(n){ byCat[n._c.label]=(byCat[n._c.label]||0)+1; });
    var counts=Object.keys(byCat).map(function(k){return byCat[k]+' '+k;}).join(', ');
    var h='<b>'+p.id+'</b> <span style="color:#889">'+total+' NOTAM'+(total==1?'':'s')+' · '+counts+'</span>';
    h+=sig.slice(0,6).map(function(n){ return '<span class="raw"><span class="ntag" style="background:'+n._c.color+'">'+n._c.label+'</span>'+nesc(notamPlain(n.text).split(/\.\s|;\s/)[0]).slice(0,120)+'</span>'; }).join('');
    if(!sig.length) h+='<span class="sub">No runway/approach/airspace items. Switch to Off for the full list.</span>';
    blk.innerHTML=h; return;
  }
  var shown=arr.slice(0,20);
  var html='<b>'+p.id+'</b> <span style="color:#889">'+total+' NOTAM'+(total==1?'':'s')+'</span>';
  html+=shown.map(function(n){var eff=fmtNz(n.start)+(n.end?'–'+fmtNz(n.end):'');
    return '<span class="raw"><span class="ntag" style="background:'+n._c.color+'">'+n._c.label+'</span>'+(eff?'['+eff+'] ':'')+nesc(notamPlain(n.text))+'</span>';}).join('');
  if(total>shown.length) html+='<span class="sub">…'+(total-shown.length)+' more — see <a class="inline" href="https://notams.aim.faa.gov/notamSearch/" target="_blank">FAA NOTAM Search ↗</a></span>';
  blk.innerHTML=html;
}
function renderNotamAI(id,arr,total){
  var e=NOTAM_RES[id]; if(!e) return; var p=e.p, blk=e.blk;
  if(NOTAM_AI[id]) return paintNotamAI(id,NOTAM_AI[id]);
  blk.innerHTML='<b>'+p.id+'</b> <span style="color:#889">summarizing '+total+' NOTAMs with AI…</span>';
  fetch('/.netlify/functions/summarize',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({airport:p.id,texts:arr.map(function(n){return n.text;})})})
    .then(function(r){return r.json();}).then(function(s){
      if(s&&s.costUSD){ PW_COST.llmUSD+=s.costUSD; PW_COST.llmTok+=((s.usage&&(s.usage.in+s.usage.out))||0); updateCostBar(); }
      NOTAM_AI[id]=s; paintNotamAI(id,s);
    }).catch(function(){ blk.innerHTML='<b>'+p.id+'</b> <span style="color:#889">AI summary unavailable</span>'; });
}
function paintNotamAI(id,s){
  var e=NOTAM_RES[id]; if(!e) return; var p=e.p, blk=e.blk;
  if(!s||s.error){ blk.innerHTML='<b>'+p.id+'</b> <span style="color:#889">AI summary unavailable'+(s&&s.error?' ('+nesc(s.error)+')':'')+'</span>'; return; }
  var txt=nesc(s.summary||'').replace(/\n/g,'<br>');
  blk.innerHTML='<b>'+p.id+'</b> <span class="ntag" style="background:#0b3d91">AI</span><div class="raw" style="white-space:normal">'+txt+'</div>'
    +(s.costUSD?'<span class="sub">'+nesc(s.model||'')+' · '+((s.usage&&(s.usage.in+s.usage.out))||0)+' tok · $'+s.costUSD.toFixed(4)+'</span>':'');
}
function condSum(cats,pts){var bad=pts.filter(function(p){return cats[p.id]&&cats[p.id]!=='VFR'&&cats[p.id]!=='NA';}).map(function(p){return p.id+' '+cats[p.id];});
  var el=document.getElementById('condsum');if(el)el.innerHTML=bad.length?'<div class="flag">⚠ Below-VFR fields now: <b>'+bad.join(', ')+'</b> — verify TAF trend, keep an approach-equipped alternate.</div>':'';
  var nc=document.getElementById('narrcond');if(nc)nc.innerHTML=bad.length?'Right now '+bad.join(', ')+' are below VFR — watch those and their TAF trends. ':'';}

document.getElementById('go').addEventListener('click',function(){render(document.getElementById('rin').value);});
document.getElementById('rin').addEventListener('keydown',function(e){if(e.key==='Enter'){e.preventDefault();render(this.value);}});
document.getElementById('rin').addEventListener('input',function(){var s=this.selectionStart,e2=this.selectionEnd,u=this.value.toUpperCase();if(u!==this.value){this.value=u;try{this.setSelectionRange(s,e2);}catch(_){}}});
['reg','depdate','dep','deptz','cruise','tas','usable','gph','rsv','funit','flowunit','amax','amin'].forEach(function(id){document.getElementById(id).addEventListener('change',function(){render(document.getElementById('rin').value);});});
(function(){var s=document.getElementById('acsel'); if(s) s.addEventListener('change',function(){fleetSelect(this.value);});
  var b1=document.getElementById('acsave'); if(b1) b1.addEventListener('click',fleetSaveCurrent);
  var b2=document.getElementById('acdef'); if(b2) b2.addEventListener('click',fleetSetDefault);
  var b3=document.getElementById('acdel'); if(b3) b3.addEventListener('click',fleetDeleteSel);})();
document.getElementById('print').addEventListener('click',function(){window.print();});
document.getElementById('tomap').addEventListener('click',function(){var rt=((document.getElementById('rin')||{}).value||'').trim().toUpperCase();var rg=((document.getElementById('reg')||{}).value||'').trim().toUpperCase().replace(/[^A-Z0-9]/g,'');if(!rt){return;}var q='/wx/?route='+encodeURIComponent(rt)+(rg?'&reg='+encodeURIComponent(rg):'');window.open(q,'_blank');});
</script>

<script>
window.PW_getState=function(){var g=function(id){return (document.getElementById(id)||{}).value;};return {route:g('rin')||'',aircraft:{reg:g('reg'),depdate:g('depdate'),dep:g('dep'),deptz:g('deptz'),cruise:g('cruise'),tas:g('tas'),usable:g('usable'),gph:g('gph'),rsv:g('rsv'),amax:g('amax'),amin:g('amin')}};};
window.PW_applyState=function(s){var st=function(id,v){var e=document.getElementById(id); if(e&&v!=null&&v!=='')e.value=v;}; if(s.aircraft){st('reg',s.aircraft.reg);st('depdate',s.aircraft.depdate);st('dep',s.aircraft.dep);st('deptz',s.aircraft.deptz);st('cruise',s.aircraft.cruise);st('tas',s.aircraft.tas);st('usable',s.aircraft.usable);st('gph',s.aircraft.gph);st('rsv',s.aircraft.rsv);st('amax',s.aircraft.amax);st('amin',s.aircraft.amin);} if(s.route){st('rin',s.route); if(typeof render==='function') render(s.route);} };
// account sync hooks (used by pwauth.js): read the local fleet, or apply a fleet pulled from the account
window.PW_getFleet=function(){ return fleetGet(); };
window.PW_applyFleet=function(f){ if(!f||!f.list) return; PW_applyingFleet=true; try{ fleetPut(f);
  var cur=((document.getElementById('reg')||{}).value||'').trim();
  if(!cur){ var o=(f.def&&f.list[f.def])?f.list[f.def]:null; if(o){ acApply(o); saveAC(); if(typeof render==='function') render((document.getElementById('rin')||{}).value||''); } }  // don't clobber an aircraft already loaded
  fleetPopulate(f.def); } finally { PW_applyingFleet=false; } };
</script>
