<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Personal Wings — Flight Briefing</title>
<style>
  :root{--ink:#1a2028;--blue:#0b3d91;--dim:#5b6b7a;--line:#d3dae6;--red:#a11;}
  *{box-sizing:border-box} body{margin:0;background:#eef1f5;color:var(--ink);font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;font-size:14px;line-height:1.5}
  .sheet{max-width:900px;margin:0 auto;background:#fff;min-height:100vh;padding:18px 22px 60px;box-shadow:0 0 24px #0002}
  .topbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;border-bottom:3px solid var(--blue);padding-bottom:10px;margin-bottom:12px}
  .topbar img{height:32px} .topbar a{color:var(--blue);text-decoration:none;font-weight:600;font-size:13px;border:1px solid var(--line);border-radius:7px;padding:5px 9px}
  #rin{flex:1;min-width:200px;border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:14px;letter-spacing:.5px}
  .ac{display:flex;gap:6px;flex-wrap:wrap;font-size:12px;color:var(--dim);align-items:center}
  .ac input{width:56px;border:1px solid var(--line);border-radius:6px;padding:5px} #cruise{width:74px} #dep{width:66px} .ac select{border:1px solid var(--line);border-radius:6px;padding:5px;font-size:12px}
  button{background:var(--blue);color:#fff;border:none;border-radius:8px;padding:8px 12px;font-size:13px;font-weight:600;cursor:pointer} button.sec{background:#e7edf6;color:var(--blue)}
  h1{font-size:19px;margin:6px 0 2px;color:var(--blue)} h2{font-size:12px;text-transform:uppercase;letter-spacing:.7px;color:var(--blue);border-bottom:1px solid var(--line);padding-bottom:3px;margin:16px 0 6px}
  .sub{color:var(--dim);font-size:12.5px;margin:2px 0} .lead{font-size:13.5px;margin:6px 0 2px}
  .narr{background:#f4f8ff;border:1px solid #cfe0f7;border-radius:8px;padding:10px 13px;margin:8px 0;font-size:13.5px;line-height:1.6}
  table{width:100%;border-collapse:collapse;font-size:12.5px;margin:4px 0} th,td{border:1px solid var(--line);padding:4px 7px;text-align:left} th{background:#eef3fb;color:var(--blue)} td.hl,th.hl{background:#fff5e0}
  .leg{border:1px solid var(--line);border-left:5px solid var(--blue);border-radius:6px;padding:8px 11px;margin:8px 0} .leg.warn{border-left-color:var(--red);background:#fdf2f2}
  .leg h3{margin:0 0 3px;font-size:14.5px;color:var(--blue)} .leg p{margin:2px 0} .fuel{color:#0b6b3a;font-weight:600} .fuel.bad{color:var(--red)} .hw{color:#a15c00} .tw{color:#0b6b3a}
  .wxrow{padding:6px 0;border-bottom:1px solid #eef1f5} .badge{display:inline-block;padding:1px 7px;border-radius:5px;color:#fff;font-weight:700;font-size:12px}
  .raw{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;color:#243247;display:block;margin-top:2px;white-space:pre-wrap} .taf{color:#0b4a8a}
  ul{margin:5px 0;padding-left:18px} li{margin:2px 0} a.inline{color:var(--blue)}
  .flag{background:#fff8e6;border:1px solid #e8cf7a;border-radius:6px;padding:7px 10px;margin:6px 0;font-size:13px}
  .foot{color:var(--dim);font-size:11px;margin-top:16px;border-top:1px solid var(--line);padding-top:8px}
  @media print{ body{background:#fff} .sheet{box-shadow:none;max-width:none} .noprint{display:none!important} .leg{break-inside:avoid} }
</style></head>

<script>
var AIRPORTS={}, CFG={}, STATE={}, WINDARR=null;
function pad(n){return (n<10?'0':'')+n;}
function gcNm(a,b){var R=3440.065,p1=a[0]*Math.PI/180,p2=b[0]*Math.PI/180,dp=(b[0]-a[0])*Math.PI/180,dl=(b[1]-a[1])*Math.PI/180;var x=Math.sin(dp/2)*Math.sin(dp/2)+Math.cos(p1)*Math.cos(p2)*Math.sin(dl/2)*Math.sin(dl/2);return 2*R*Math.asin(Math.sqrt(x));}
function brg(a,b){var y=Math.sin((b[1]-a[1])*Math.PI/180)*Math.cos(b[0]*Math.PI/180);var x=Math.cos(a[0]*Math.PI/180)*Math.sin(b[0]*Math.PI/180)-Math.sin(a[0]*Math.PI/180)*Math.cos(b[0]*Math.PI/180)*Math.cos((b[1]-a[1])*Math.PI/180);return Math.round((Math.atan2(y,x)*180/Math.PI+360)%360);}

function lvLabel(h){for(var i=0;i<LV.length;i++)if(LV[i][0]===h)return LV[i][2];return h+'mb';}

function depEpoch(){
  var s=(document.getElementById('dep').value||'').replace(/[^0-9]/g,''); if(s.length<3) return Date.now();
  var hh=parseInt(s.slice(0,s.length-2)),mm=parseInt(s.slice(-2)); if(isNaN(hh)||isNaN(mm))return Date.now();
  var now=new Date(),ep;
  if(document.getElementById('deptz').value==='Z'){ ep=Date.UTC(now.getUTCFullYear(),now.getUTCMonth(),now.getUTCDate(),hh,mm); }
  else { var d=new Date(); d.setHours(hh,mm,0,0); ep=d.getTime(); }
  if(ep < Date.now()-3600000) ep+=86400000;   // assume next day if well past
  return ep;
}

function saveAC(){try{var o={};['dep','deptz','cruise','tas','usable','gph','rsv'].forEach(function(k){o[k]=document.getElementById(k).value;});localStorage.setItem('pw_ac',JSON.stringify(o));}catch(e){}}
function loadAC(){try{var a=JSON.parse(localStorage.getItem('pw_ac')||'{}');['dep','deptz','cruise','tas','usable','gph','rsv'].forEach(function(k){if(a[k]!=null&&a[k]!=='')document.getElementById(k).value=a[k];});}catch(e){}}
function setRoute(str){try{localStorage.setItem('pw_route',str);}catch(e){}history.replaceState(null,'',location.pathname+'?route='+encodeURIComponent(str));}

Promise.all([
  fetch('/wx/airports.json').then(function(r){return r.json();}).catch(function(){return {};}),
  fetch('/wx/wx-config.json',{cache:'no-store'}).then(function(r){return r.json();}).catch(function(){return {};})
]).then(function(res){AIRPORTS=res[0]||{};CFG=res[1]||{};loadAC();var r=getRoute();document.getElementById('rin').value=r;render(r);});

function render(routeStr){
  var out=document.getElementById('out'); saveAC();
  var ids=(routeStr||'').trim().toUpperCase().split(/[^A-Z0-9]+/).filter(Boolean);
  var pts=[],miss=[]; ids.forEach(function(id){var a=resolve(id);if(a)pts.push({id:id,la:a[0],lo:a[1],name:a[2],el:a[3]});else miss.push(id);});
  if(pts.length<2){out.innerHTML='<h1>Enter a route</h1><p class="sub">Type ≥2 identifiers and press Update.'+(miss.length?' Unknown: '+miss.join(', '):'')+'</p>';return;}
  setRoute(pts.map(function(p){return p.id;}).join(' '));
  var CR=num('cruise',10000),TAS=num('tas',145),USABLE=num('usable',87),GPH=num('gph',18),RSV=num('rsv',45);
  var legs=[],maxE=-9999,maxId='';
  for(var i=0;i<pts.length-1;i++){var a=[pts[i].la,pts[i].lo],b=[pts[i+1].la,pts[i+1].lo];legs.push({d:gcNm(a,b),crs:brg(a,b),mid:[(a[0]+b[0])/2,(a[1]+b[1])/2]});}
  pts.forEach(function(p){if(p.el!=null&&p.el>maxE){maxE=p.el;maxId=p.id;}});
  STATE={pts:pts,legs:legs,CR:CR,TAS:TAS,USABLE:USABLE,GPH:GPH,RSV:RSV,lv:nearestLv(CR),maxE:maxE,maxId:maxId,dep:depEpoch()};
  var depTxt=(document.getElementById('dep').value?('dep '+hhmmL(STATE.dep)+'L / '+hhmmZ(STATE.dep)):'dep now');
  var h='<h1>'+pts.map(function(p){return p.id;}).join(' → ')+'</h1>';
  h+='<div class="sub">'+pts.map(function(p){return p.name;}).join(' · ')+'</div>';
  h+='<div class="sub">'+depTxt+' · cruise <b>'+CR.toLocaleString()+'′</b> (~'+STATE.lv[2]+') · TAS '+TAS+' · '+USABLE+' gal / '+GPH+' gph · '+(pts.length-1)+' legs'+(miss.length?' · <span style="color:#c00">unknown: '+miss.join(', ')+'</span>':'')+'</div>';
  h+='<div id="narr"></div><div id="ov"></div><h2>Legs</h2><div id="legsec"></div><div id="condsum"></div>';
  h+='<h2>Current conditions &amp; TAF</h2><div id="wx"></div>';
  h+='<h2>Winds &amp; temps aloft</h2><div id="wind">loading…</div>';
  h+='<h2>Fuel &amp; services</h2><ul>'+pts.map(function(p){return '<li><b>'+p.id+'</b> — '+p.name+', '+(p.el!=null?p.el.toLocaleString()+"′":'—')+' · <a class="inline" href="https://www.airnav.com/airport/'+p.id+'" target="_blank">AirNav ↗</a></li>';}).join('')+'</ul>';
  h+='<h2>Notes</h2><ul><li>Legs wind-corrected at cruise level for the time you\'ll fly each (needs departure time; else current hour).</li><li>Small fields may lack weather, approaches, or fuel — confirm by phone.</li><li>Official TAFs/NOTAMs/TFRs &amp; filing: <a class="inline" href="https://www.1800wxbrief.com" target="_blank">1800wxbrief.com</a>.</li></ul>';
  h+='<div class="foot">Personal Wings · planning aid — not a substitute for a 1800wxbrief/FSS briefing, TFR/NOTAM check, W&amp;B, and DA/performance planning. METAR: NWS · TAF: metar-taf.com · winds: Open-Meteo · fuel/FBO: AirNav.</div>';
  out.innerHTML=h;
  WINDARR=null; compute(); loadMetars(pts); loadWinds();
}

function legTimes(useWind){ // returns {gs:[],hr:[],burn:[],startMs:[],comp:[],wind:[]}
  var S=STATE,r={gs:[],hr:[],burn:[],startMs:[],comp:[],wind:[]},t=S.dep;
  for(var i=0;i<S.legs.length;i++){
    var L=S.legs[i],comp=0,w=null;
    if(useWind&&WINDARR&&WINDARR[i]){ var hs=hourStr(t); var ix=WINDARR[i].time.indexOf(hs); if(ix<0)ix=0;
      var dr=WINDARR[i]['wd'+S.lv[0]][ix], sp=WINDARR[i]['ws'+S.lv[0]][ix], tc=WINDARR[i]['t'+S.lv[0]]?WINDARR[i]['t'+S.lv[0]][ix]:null;
      if(dr!=null){ comp=headwind(sp,dr,L.crs); w={dir:dr,spd:sp,tC:tc}; } }
    var gs=Math.max(40,S.TAS-comp),hr=L.d/gs;
    r.gs.push(gs);r.hr.push(hr);r.burn.push(hr*S.GPH);r.startMs.push(t);r.comp.push(comp);r.wind.push(w);
    t+=hr*3600000;
  }
  r.endMs=t; return r;
}

function compute(){
  var S=STATE,haveW=!!WINDARR,T=legTimes(haveW);
  var rsvGal=S.RSV/60*S.GPH,endHr=S.USABLE/S.GPH,tot=0,totHr=0,totBurn=0,html='',showDep=!!document.getElementById('dep').value;
  S.legs.forEach(function(L,i){
    var gs=T.gs[i],hr=T.hr[i],burn=T.burn[i];tot+=L.d;totHr+=hr;totBurn+=burn;
    var tight=(burn+rsvGal)>S.USABLE,remAfter=S.USABLE-burn,b=S.pts[i+1],w=T.wind[i],comp=T.comp[i];
    var wtxt=w?(' · wind '+Math.round(w.dir)+'°/'+Math.round(w.spd)+'kt → <span class="'+(comp>=0?'hw':'tw')+'">'+(comp>=0?'HW ':'TW ')+Math.abs(Math.round(comp))+'kt</span>'+(w.tC!=null?', '+Math.round(w.tC)+'°C':'')):'';
    var eta=showDep?(' · ETA '+hhmmL(T.startMs[i]+hr*3600000)+'L/'+hhmmZ(T.startMs[i]+hr*3600000)):'';
    html+='<div class="leg'+(tight?' warn':'')+'"><h3>Leg '+(i+1)+' — '+S.pts[i].id+' → '+S.pts[i+1].id+'</h3>';
    html+='<p><b>'+Math.round(L.d)+' nm</b> · crs '+L.crs+'° ('+compass(L.crs)+') · GS <b>'+Math.round(gs)+' kt</b> · ~<b>'+hr.toFixed(1)+' hr</b>'+eta+wtxt+'</p>';
    html+='<p class="fuel'+(tight?' bad':'')+'">Fuel: ~<b>'+Math.round(burn)+' gal</b>'+(tight?' — ⚠ exceeds single-tank range w/ '+S.RSV+'-min reserve; refuel or shorten.':'; land w/ ~'+Math.round(remAfter)+' gal (~'+Math.round((remAfter-rsvGal)/S.GPH*60)+' min past reserve).')+'</p>';
    html+='<p class="sub">Into '+b.id+' — '+b.name+', '+(b.el!=null?b.el.toLocaleString()+"′":'—')+(b.el!=null&&b.el>=5000?' (watch DA)':'')+' · <a class="inline" href="https://www.airnav.com/airport/'+b.id+'" target="_blank">AirNav fuel/FBO ↗</a></p></div>';
  });
  document.getElementById('legsec').innerHTML=html+'<div class="sub">Trip: ~'+totHr.toFixed(1)+' hr, ~<b>'+Math.round(totBurn)+' gal</b>'+(haveW?' (wind-corrected)':' (zero-wind — winds loading…)')+(showDep?' · arrive '+hhmmL(T.endMs)+'L/'+hhmmZ(T.endMs):'')+'.</div>';
  // best altitude + ISA (needs winds)
  var extra='';
  if(haveW){
    var best=bestAlt(); if(best) extra+=' '+best.txt;
    var isa=isaDev(); if(isa) extra+=' '+isa;
  }
  var ovNarr='Route is <b>'+Math.round(tot)+' nm</b> in '+S.legs.length+' leg'+(S.legs.length>1?'s':'')+', about <b>'+totHr.toFixed(1)+' hr</b>'+(haveW?' with forecast winds':' (zero-wind)')+' at '+S.CR.toLocaleString()+'′/'+S.TAS+' kt TAS. Highest field <b>'+(S.maxE>-9999?S.maxE.toLocaleString()+"′ ("+S.maxId+')':'—')+'</b>'+(S.maxE>=8000?' — expect high DA':'')+'. O₂ &gt;12,500′(30m)/&gt;14,000′. Endurance ~'+endHr.toFixed(1)+' hr.'+extra;
  document.getElementById('ov').innerHTML='<h2>Overview</h2><p class="lead">'+ovNarr+'</p>';
  document.getElementById('narr').innerHTML='<div class="narr">'+narrative(T,totHr,totBurn,haveW,showDep)+'</div>';
}

function bestAlt(){ // compare avg component across levels
  if(!WINDARR) return null; var S=STATE,best=null;
  LV.forEach(function(l){ var hpa=l[0]; if(!WINDARR[0]||!WINDARR[0]['ws'+hpa]) return;
    var sum=0,n=0,t=S.dep;
    for(var i=0;i<S.legs.length;i++){ var wa=WINDARR[i]; var ix=wa.time.indexOf(hourStr(t)); if(ix<0)ix=0;
      var dr=wa['wd'+hpa][ix],sp=wa['ws'+hpa][ix]; if(dr!=null){ sum+=headwind(sp,dr,S.legs[i].crs); n++; }
      t+=(S.legs[i].d/Math.max(40,S.TAS))*3600000; }
    if(n){ var avg=sum/n; if(best===null||avg<best.avg) best={avg:avg,hpa:hpa,lab:l[2]}; } });
  if(!best) return null;
  var mine=null; { var sum=0,n=0,t=S.dep; for(var i=0;i<S.legs.length;i++){var wa=WINDARR[i];var ix=wa.time.indexOf(hourStr(t));if(ix<0)ix=0;var dr=wa['wd'+S.lv[0]][ix],sp=wa['ws'+S.lv[0]][ix];if(dr!=null){sum+=headwind(sp,dr,S.legs[i].crs);n++;}t+=(S.legs[i].d/Math.max(40,S.TAS))*3600000;} if(n)mine=sum/n; }
  function d(x){return (x>=0?'HW ':'TW ')+Math.abs(Math.round(x))+' kt';}
  var t='<b>Best winds:</b> '+best.lab+' (avg '+d(best.avg)+' along route)';
  if(mine!=null && best.hpa!==S.lv[0]) t+=' vs your '+S.lv[2]+' (avg '+d(mine)+') — consider '+best.lab+'.';
  else t+=' — you\'re at the best level.';
  return {txt:t,hpa:best.hpa};
}
function isaDev(){ if(!WINDARR||!WINDARR[0]) return ''; var S=STATE,hpa=S.lv[0],sum=0,n=0,t=S.dep;
  for(var i=0;i<S.legs.length;i++){var wa=WINDARR[i];if(!wa['t'+hpa])continue;var ix=wa.time.indexOf(hourStr(t));if(ix<0)ix=0;var tc=wa['t'+hpa][ix];if(tc!=null){sum+=tc;n++;}t+=(S.legs[i].d/Math.max(40,S.TAS))*3600000;}
  if(!n)return''; var avgT=sum/n, isa=15-1.98*(S.CR/1000), dev=avgT-isa;
  return 'Cruise temp ~'+Math.round(avgT)+'°C ('+(dev>=0?'+':'')+Math.round(dev)+'°C vs ISA'+(dev>=8?', warm — higher DA/TAS, reduced climb':dev<=-8?', cold':'')+').';
}
function narrative(T,totHr,totBurn,haveW,showDep){
  var S=STATE,dest=S.pts[S.pts.length-1];
  var s='<b>Briefing.</b> '+(showDep?'Departing '+S.pts[0].id+' at '+hhmmL(S.dep)+'L ('+hhmmZ(S.dep)+'), t':'T')+'he '+Math.round(S.legs.reduce(function(a,L){return a+L.d;},0))+' nm route to '+dest.id+' ('+S.pts.length+' fields, '+S.legs.length+' legs) plans ~'+totHr.toFixed(1)+' hr at '+S.CR.toLocaleString()+'′, TAS '+S.TAS+'. ';
  if(haveW){ var avgGS=Math.round(S.legs.reduce(function(a,L){return a+L.d;},0)/totHr); s+='With the forecast winds, average groundspeed is ~'+avgGS+' kt. '; var b=bestAlt(); if(b) s+=b.txt.replace(/<[^>]+>/g,'')+' '; }
  else s+='Winds loading… ';
  var tightIdx=[]; T.burn.forEach(function(bn,i){ if((bn+S.RSV/60*S.GPH)>S.USABLE) tightIdx.push(i+1); });
  s+='Highest field is '+(S.maxE>-9999?S.maxE.toLocaleString()+"′ ("+S.maxId+')':'—')+(S.maxE>=8000?' — plan for high density altitude':'')+'. ';
  s+=(tightIdx.length? '⚠ Leg'+(tightIdx.length>1?'s':'')+' '+tightIdx.join(', ')+' exceed single-tank range with reserve — a fuel stop is required there. ' : 'Fuel: all legs sit within single-tank range with your reserve; ~'+Math.round(totBurn)+' gal total. ');
  s+='<span id="narrcond"></span>';
  s+='File IFR as appropriate and pull official TAFs, NOTAMs and TFRs at 1800wxbrief before departure.';
  return s;
}

function loadWinds(){
  var S=STATE, lvls=LV.map(function(l){return l[0];});
  var params=[]; lvls.forEach(function(p){params.push('wind_speed_'+p+'hPa','wind_direction_'+p+'hPa','temperature_'+p+'hPa');});
  var lats=S.legs.map(function(L){return L.mid[0].toFixed(3);}).join(','), lons=S.legs.map(function(L){return L.mid[1].toFixed(3);}).join(',');
  fetch('https://api.open-meteo.com/v1/forecast?latitude='+lats+'&longitude='+lons+'&hourly='+params.join(',')+'&wind_speed_unit=kn&forecast_days=3&timezone=UTC')
    .then(function(r){return r.json();}).then(function(arr){
      if(!Array.isArray(arr))arr=[arr];
      WINDARR=arr.map(function(loc){ if(!loc.hourly)return null; var o={time:loc.hourly.time}; lvls.forEach(function(p){o['ws'+p]=loc.hourly['wind_speed_'+p+'hPa'];o['wd'+p]=loc.hourly['wind_direction_'+p+'hPa'];o['t'+p]=loc.hourly['temperature_'+p+'hPa'];}); return o; });
      compute();
      // winds table at leg start times, highlight cruise
      var cols=[[850,'5k'],[700,'FL100'],[500,'FL180'],[300,'FL300'],[200,'FL390']];
      if(!cols.some(function(c){return c[0]===S.lv[0];})) cols.push([S.lv[0],S.lv[2]]);
      var T=legTimes(true),th='<table><tr><th>Leg</th><th>@</th>'+cols.map(function(c){return '<th class="'+(c[0]===S.lv[0]?'hl':'')+'">'+(c[0]===S.lv[0]?'★':'')+c[1]+'</th>';}).join('')+'</tr>';
      S.legs.forEach(function(L,idx){ var wa=WINDARR[idx]; if(!wa){return;} var ix=wa.time.indexOf(hourStr(T.startMs[idx]));if(ix<0)ix=0;
        th+='<tr><td>'+S.pts[idx].id+'–'+S.pts[idx+1].id+'</td><td>'+hhmmZ(T.startMs[idx])+'</td>'+cols.map(function(c){var dr=wa['wd'+c[0]],sp=wa['ws'+c[0]];var v=(dr&&dr[ix]!=null)?Math.round(dr[ix])+'°/'+Math.round(sp[ix])+'kt':'—';return '<td class="'+(c[0]===S.lv[0]?'hl':'')+'">'+v+'</td>';}).join('')+'</tr>';});
      th+='</table><div class="sub">★ cruise level ('+S.lv[2]+'). Winds shown at each leg\'s time.</div>';
      document.getElementById('wind').innerHTML=th;
    }).catch(function(){document.getElementById('wind').innerHTML='<span style="color:#889">winds unavailable — legs zero-wind</span>';});
}

function loadMetars(pts){
  var wx=document.getElementById('wx'), cats={};
  pts.forEach(function(p){
    var row=document.createElement('div');row.className='wxrow';var ml=document.createElement('div'),tl=document.createElement('div');tl.className='raw taf';
    ml.innerHTML='<b>'+p.id+'</b> <span style="color:#889">…</span>';row.appendChild(ml);row.appendChild(tl);wx.appendChild(row);
    fetch('https://api.weather.gov/stations/'+p.id+'/observations/latest',{headers:{'Accept':'application/geo+json'}})
      .then(function(r){if(!r.ok)throw 0;return r.json();}).then(function(j){
        var q=j.properties||{},vm=q.visibility&&q.visibility.value,vs=vm==null?99:vm/1609.34,ce=99999;
        (q.cloudLayers||[]).forEach(function(cl){if((cl.amount==='BKN'||cl.amount==='OVC'||cl.amount==='VV')&&cl.base&&cl.base.value!=null)ce=Math.min(ce,cl.base.value/0.3048);});
        var fc=cat(vs,ce);cats[p.id]=fc;condSum(cats,pts);
        ml.innerHTML='<span class="badge" style="background:'+CC[fc]+'">'+fc+'</span> <b>'+p.id+'</b> <span style="color:#889">'+fmtAge(q.timestamp)+'</span><span class="raw">'+(q.rawMessage||'(no METAR)')+'</span>';
      }).catch(function(){cats[p.id]='NA';ml.innerHTML='<span class="badge" style="background:#8090a0">--</span> <b>'+p.id+'</b> <span style="color:#889">no METAR (small field)</span>';});
    if(CFG.tafProxy){fetch(CFG.tafProxy+(CFG.tafProxy.indexOf('?')<0?'?':'&')+'id='+encodeURIComponent(p.id)).then(function(r){return r.json();}).then(function(t){var raw=t&&t.taf&&t.taf.raw;if(raw)tl.textContent=raw;}).catch(function(){});}
  });
}
function condSum(cats,pts){var bad=pts.filter(function(p){return cats[p.id]&&cats[p.id]!=='VFR'&&cats[p.id]!=='NA';}).map(function(p){return p.id+' '+cats[p.id];});
  var el=document.getElementById('condsum');if(el)el.innerHTML=bad.length?'<div class="flag">⚠ Below-VFR fields now: <b>'+bad.join(', ')+'</b> — verify TAF trend, keep an approach-equipped alternate.</div>':'';
  var nc=document.getElementById('narrcond');if(nc)nc.innerHTML=bad.length?'Right now '+bad.join(', ')+' are below VFR — watch those and their TAF trends. ':'';}

document.getElementById('go').addEventListener('click',function(){render(document.getElementById('rin').value);});
document.getElementById('rin').addEventListener('keydown',function(e){if(e.key==='Enter'){e.preventDefault();render(this.value);}});
['dep','deptz','cruise','tas','usable','gph','rsv'].forEach(function(id){document.getElementById(id).addEventListener('change',function(){render(document.getElementById('rin').value);});});
document.getElementById('print').addEventListener('click',function(){window.print();});
</script>
